name: publish
# On a version tag: test, build, publish to PyPI with trusted publishing
# (no token stored here; PyPI trusts this repository and workflow by name).
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pyproject says $v"; exit 1; }
      - run: pip install ".[signatures]" build
      - run: python -m unittest discover -s tests
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
