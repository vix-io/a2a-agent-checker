[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-agent-checker"
version = "0.4.1"
description = "Check a domain's A2A Agent Card against the v1.0 specification."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
authors = [{name = "Viktor Lyaskov"}]
keywords = ["a2a", "agent2agent", "agent-card", "ai-agents", "validator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
signatures = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/vix-io/a2a-agent-checker"
"Online checker" = "https://stillopen.work/agents/check"

[project.scripts]
a2a-check = "a2a_agent_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a2a_agent_checker = ["report.schema.json"]
