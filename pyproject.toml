[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-agent-checker"
version = "0.1.1"
description = "Check a domain's A2A Agent Card against the v1.0 specification."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
a2a-check = "a2a_agent_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
